name: test
on: [push, pull_request]
jobs:
  integrations:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo build --release --manifest-path tests/fake-hn/Cargo.toml
      - run: node tests/run.mjs
        shell: bash
