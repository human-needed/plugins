AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  HumanNeeded cloud relay. A cloud Claude session's hook POSTs a puck state to /h/{account key};
  the relay forwards it unchanged over a WebSocket to the user's PC, which connected with that key.
  No messages are stored: the only table maps account key -> open WebSocket connection ids, plus
  connection id -> account key so a closed connection can be removed (both 3 h TTL).

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  StageName:
    Type: String
    Default: v1

Resources:
  Connections:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: ch, AttributeType: S }
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: ch, KeyType: HASH }
        - { AttributeName: id, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  RelayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: relay
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: !GetAtt Connections.Arn
              - Effect: Allow
                Action: execute-api:ManageConnections
                Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/${StageName}/POST/@connections/*

  RelayFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt RelayRole.Arn
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          TABLE: !Ref Connections
          WS_ENDPOINT: !Sub https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
      Code:
        ZipFile: |
          // HumanNeeded relay (inline: must stay under 4096 characters).
          const { DynamoDBClient, PutItemCommand, DeleteItemCommand, QueryCommand } = require('@aws-sdk/client-dynamodb');
          const { ApiGatewayManagementApiClient, PostToConnectionCommand } = require('@aws-sdk/client-apigatewaymanagementapi');
          const db = new DynamoDBClient({});
          const ws = new ApiGatewayManagementApiClient({ endpoint: process.env.WS_ENDPOINT });
          const T = process.env.TABLE;
          const KEY = /^[0-9a-f]{32}$/;
          // Each connection has two items: (key, connection id), and ('#' + connection id, '-') holding the key,
          // because $disconnect only carries the connection id.
          const drop = (k, id) => db.send(new DeleteItemCommand({ TableName: T, Key: { ch: { S: k }, id: { S: id } }, ReturnValues: 'ALL_OLD' }));
          const reply = (statusCode, o) => ({ statusCode, headers: { 'content-type': 'application/json' }, body: JSON.stringify(o) });

          exports.handler = async (event) => {
            const rc = event.requestContext || {};
            if (rc.connectionId) {
              // WebSocket API: the PC's connector connects with ?k=<account key>; pings need no answer.
              if (rc.routeKey === '$connect') {
                const k = (event.queryStringParameters || {}).k || '';
                if (!KEY.test(k)) return { statusCode: 400 };
                const ttl = { N: String(Math.floor(Date.now() / 1000) + 3 * 3600) };
                await Promise.all([{ ch: { S: k }, id: { S: rc.connectionId }, ttl }, { ch: { S: '#' + rc.connectionId }, id: { S: '-' }, k: { S: k }, ttl }]
                  .map((Item) => db.send(new PutItemCommand({ TableName: T, Item }))));
              } else if (rc.routeKey === '$disconnect') {
                const old = await drop('#' + rc.connectionId, '-');
                if (old.Attributes?.k) await drop(old.Attributes.k.S, rc.connectionId);
              }
              return { statusCode: 200 };
            }

            // POST /h/{account key} from a cloud session's hook, via the function URL.
            const m = /^\/h\/([0-9a-f]{32})$/.exec(event.rawPath || '');
            if (!m || (rc.http || {}).method !== 'POST') return reply(404, { error: 'not found' });
            let body = event.body || '';
            if (event.isBase64Encoded) body = Buffer.from(body, 'base64').toString('utf8');
            if (body.length < 2 || body.length > 512) return reply(400, { error: 'bad request' });

            const conns = await db.send(new QueryCommand({ TableName: T, KeyConditionExpression: 'ch = :c',
              ExpressionAttributeValues: { ':c': { S: m[1] } }, Limit: 25 }));
            let delivered = 0;
            await Promise.all((conns.Items || []).map(async (item) => {
              try {
                await ws.send(new PostToConnectionCommand({ ConnectionId: item.id.S, Data: Buffer.from(body) }));
                delivered++;
              } catch (e) {
                if (e.name === 'GoneException' || e.$metadata?.httpStatusCode === 410) {
                  await Promise.all([drop(m[1], item.id.S), drop('#' + item.id.S, '-')]).catch(() => {});
                }
              }
            }));
            return reply(202, { delivered });
          };

  # --- WebSocket API (PC side) ---
  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: humanneeded-relay-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  WsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RelayFunction.Arn}/invocations

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: $connect, Target: !Sub 'integrations/${WsIntegration}' }
  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: $disconnect, Target: !Sub 'integrations/${WsIntegration}' }
  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: $default, Target: !Sub 'integrations/${WsIntegration}' }

  WsDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn: [WsConnectRoute, WsDisconnectRoute, WsDefaultRoute]
    Properties: { ApiId: !Ref WsApi }

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WsApi
      StageName: !Ref StageName
      DeploymentId: !Ref WsDeployment
      DefaultRouteSettings: { ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10 }

  WsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RelayFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*

  # --- Function URL (cloud session side; Cowork sessions connected to a PC block execute-api hosts) ---
  RelayUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt RelayFunction.Arn
      AuthType: NONE

  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref RelayFunction
      FunctionUrlAuthType: NONE
      Principal: '*'

  UrlInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RelayFunction
      InvokedViaFunctionUrl: true
      Principal: '*'

Outputs:
  FunctionUrl:
    Description: Cloud hooks POST to <FunctionUrl>h/<account key>
    Value: !GetAtt RelayUrl.FunctionUrl
  WebSocketUrl:
    Description: The PC connects here with ?k=<account key>
    Value: !Sub wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
