AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  HumanNeeded cloud relay. A cloud Claude session's hook POSTs a puck state to /h/{session hash}
  (or, signed, to /s/{channel}); the relay forwards it unchanged to the PC that claimed that
  session (or holds that channel) over a WebSocket. No messages are stored: the only table maps
  channel or session hash -> open WebSocket connection ids, expiring after 3 h / 24 h.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  StageName:
    Type: String
    Default: v1

Resources:
  Connections:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: ch, AttributeType: S }
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: ch, KeyType: HASH }
        - { AttributeName: id, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  RelayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: relay
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: !GetAtt Connections.Arn
              - Effect: Allow
                Action: execute-api:ManageConnections
                Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/${StageName}/POST/@connections/*

  RelayFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt RelayRole.Arn
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          TABLE: !Ref Connections
          WS_ENDPOINT: !Sub https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
      Code:
        ZipFile: |
          // HumanNeeded relay (inline: must stay under 4096 characters).
          const { DynamoDBClient, PutItemCommand, DeleteItemCommand, QueryCommand } = require('@aws-sdk/client-dynamodb');
          const { ApiGatewayManagementApiClient, PostToConnectionCommand } = require('@aws-sdk/client-apigatewaymanagementapi');
          const db = new DynamoDBClient({});
          const ws = new ApiGatewayManagementApiClient({ endpoint: process.env.WS_ENDPOINT });
          const T = process.env.TABLE;
          const HEX32 = /^[0-9a-f]{32}$/, SIG = /^[0-9a-f]{64}$/;
          const now = () => Math.floor(Date.now() / 1000);
          const reply = (statusCode, o) => ({ statusCode, headers: { 'content-type': 'application/json' }, body: JSON.stringify(o) });
          const put = (key, id, hours) => db.send(new PutItemCommand({ TableName: T,
            Item: { ch: { S: key }, id: { S: id }, ttl: { N: String(now() + hours * 3600) } } }));

          exports.handler = async (event) => {
            const rc = event.requestContext || {};
            if (rc.connectionId) {
              // WebSocket API: the PC's listener.
              if (rc.routeKey === '$connect') {
                const ch = (event.queryStringParameters || {}).ch || '';
                if (!HEX32.test(ch)) return { statusCode: 400 };
                await put(ch, rc.connectionId, 3);
                return { statusCode: 200 };
              }
              if (rc.routeKey === '$default') {
                // {"action":"claim","h":[...]}: this PC takes the states of these cloud session hashes.
                let m = {};
                try { m = JSON.parse(event.body || '{}'); } catch (e) {}
                if (m.action === 'claim' && Array.isArray(m.h)) {
                  await Promise.all(m.h.filter((h) => HEX32.test(h)).slice(0, 16).map((h) => put('h' + h, rc.connectionId, 24)));
                }
              }
              return { statusCode: 200 };
            }

            // POST /s/{channel} (signed) or /h/{hash} (claimed session) from a cloud hook, via the
            // HTTP API or the function URL (reachable where execute-api is blocked).
            let pp = event.pathParameters;
            if (!pp) {
              const m = /^\/(h|s)\/([0-9a-f]{32})$/.exec(event.rawPath || '');
              if (!m || (rc.http || {}).method !== 'POST') return reply(404, { error: 'not found' });
              pp = m[1] === 's' ? { channel: m[2] } : { hash: m[2] };
            }
            const sig = ((event.headers || {})['x-hn-sig'] || '').toLowerCase();
            let body = event.body || '';
            if (event.isBase64Encoded) body = Buffer.from(body, 'base64').toString('utf8');
            if (body.length < 2 || body.length > 512) return reply(400, { error: 'bad request' });
            let key;
            if (pp.channel !== undefined) {
              if (!HEX32.test(pp.channel) || !SIG.test(sig)) return reply(400, { error: 'bad request' });
              key = pp.channel;
            } else {
              if (!HEX32.test(pp.hash || '')) return reply(400, { error: 'bad request' });
              key = 'h' + pp.hash;
            }

            const conns = await db.send(new QueryCommand({ TableName: T, KeyConditionExpression: 'ch = :c',
              ExpressionAttributeValues: { ':c': { S: key } }, Limit: 4 }));
            const data = Buffer.from(JSON.stringify({ b: body, sig: pp.channel !== undefined ? sig : '', h: pp.hash || '' }));
            let delivered = 0;
            await Promise.all((conns.Items || []).map(async (item) => {
              try {
                await ws.send(new PostToConnectionCommand({ ConnectionId: item.id.S, Data: data }));
                delivered++;
              } catch (e) {
                if (e.name === 'GoneException' || e.$metadata?.httpStatusCode === 410) {
                  await db.send(new DeleteItemCommand({ TableName: T, Key: { ch: { S: key }, id: item.id } })).catch(() => {});
                }
              }
            }));
            return reply(202, { delivered });
          };

  # --- WebSocket API (PC side) ---
  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: humanneeded-relay-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  WsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RelayFunction.Arn}/invocations

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: $connect, Target: !Sub 'integrations/${WsIntegration}' }
  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: $disconnect, Target: !Sub 'integrations/${WsIntegration}' }
  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: $default, Target: !Sub 'integrations/${WsIntegration}' }

  WsDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn: [WsConnectRoute, WsDisconnectRoute, WsDefaultRoute]
    Properties: { ApiId: !Ref WsApi }

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WsApi
      StageName: !Ref StageName
      DeploymentId: !Ref WsDeployment
      DefaultRouteSettings: { ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10 }

  # --- HTTP API (cloud session side) ---
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: humanneeded-relay-http
      ProtocolType: HTTP

  HttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      PayloadFormatVersion: '2.0'
      IntegrationUri: !GetAtt RelayFunction.Arn

  HttpPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'POST /s/{channel}', Target: !Sub 'integrations/${HttpIntegration}' }
  HttpSessionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'POST /h/{hash}', Target: !Sub 'integrations/${HttpIntegration}' }

  HttpStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings: { ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10 }

  WsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RelayFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*

  HttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RelayFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  # --- Function URL (cloud session side; Cowork's connected sessions block execute-api) ---
  RelayUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt RelayFunction.Arn
      AuthType: NONE

  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref RelayFunction
      FunctionUrlAuthType: NONE
      Principal: '*'

  UrlInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RelayFunction
      InvokedViaFunctionUrl: true
      Principal: '*'

Outputs:
  FunctionUrl:
    Description: Cloud hooks POST to <FunctionUrl>h/<hash> or <FunctionUrl>s/<channel>
    Value: !GetAtt RelayUrl.FunctionUrl
  WebSocketUrl:
    Description: The PC connects here with ?ch=<channel>
    Value: !Sub wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  PostUrl:
    Description: Cloud hooks POST signed states to <PostUrl>/s/<channel>
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
