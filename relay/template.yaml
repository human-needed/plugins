AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  HumanNeeded relay hn-relay/1 (pm/contracts/relay-api.md). Cloud hooks POST a state to
  https://relay.human-needed.com/v1/h/{K}; the PC app holds wss://relay-ws.human-needed.com/v1,
  authenticated with a per-PC secret. Stores bindings and live connection ids only, never states.
  A 15-minute synthetic probe emails the user when the round trip fails.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate (us-east-2) for both relay names. Empty = no custom domains yet.
  PostDomain:
    Type: String
    Default: relay.human-needed.com
  WsDomain:
    Type: String
    Default: relay-ws.human-needed.com
  AlertEmail:
    Type: String
    Default: ''
    Description: Gets probe failures and budget alerts. Empty = no alerts.
  ProbeSecret:
    Type: String
    NoEcho: true
    AllowedPattern: '^[0-9a-f]{64}$'
    Description: The probe PC's secret S (64 hex). Generated once by deploy.sh.

Conditions:
  HasDomains: !Not [!Equals [!Ref CertificateArn, '']]
  HasEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  # ---------- storage ----------
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      SSESpecification: { SSEEnabled: true }

  # ---------- relay function ----------
  RelayLogs:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 14 }

  RelayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: relay
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt RelayLogs.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action: execute-api:ManageConnections
                Resource: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/v1/*/@connections/*

  RelayFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: hn-relay/1 POST + WebSocket handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: relay.handler
      Code: src/
      Role: !GetAtt RelayRole.Arn
      Timeout: 5
      MemorySize: 256
      # No per-invocation START/END/REPORT lines (they'd cost more than the relay itself at scale);
      # only errors are logged. Durations and counts come from free CloudWatch metrics.
      LoggingConfig: { LogGroup: !Ref RelayLogs, LogFormat: JSON, ApplicationLogLevel: ERROR, SystemLogLevel: WARN }
      Environment:
        Variables:
          TABLE: !Ref Table
          WS_ENDPOINT: !Sub https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/v1

  # ---------- cloud side: HTTP API ----------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: hn-relay-v1-post
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: false

  HttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt RelayFunction.Arn
      PayloadFormatVersion: '2.0'

  HttpPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'POST /v1/h/{k}', Target: !Sub 'integrations/${HttpIntegration}' }

  HttpStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      # Global cap on the whole POST side (abuse/cost guard). Per-K and per-IP limits are in the function.
      DefaultRouteSettings: { ThrottlingBurstLimit: 40, ThrottlingRateLimit: 20 }

  HttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RelayFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/v1/h/*

  # ---------- PC side: WebSocket API ----------
  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: hn-relay-v1-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.t

  WsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RelayFunction.Arn}/invocations

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: $connect, Target: !Sub 'integrations/${WsIntegration}' }
  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: $disconnect, Target: !Sub 'integrations/${WsIntegration}' }
  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: $default, Target: !Sub 'integrations/${WsIntegration}' }

  # {"t":"ping"} is answered by API Gateway itself (no Lambda, no table read): keeps the socket
  # alive for the price of the message only.
  WsPingIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: MOCK
      TemplateSelectionExpression: \$default
      RequestTemplates: { $default: '{"statusCode":200}' }
  WsPingRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: ping, Target: !Sub 'integrations/${WsPingIntegration}' }

  WsDeploymentV2:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn: [WsConnectRoute, WsDisconnectRoute, WsDefaultRoute, WsPingRoute]
    Properties: { ApiId: !Ref WsApi }

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WsApi
      StageName: v1
      DeploymentId: !Ref WsDeploymentV2
      DefaultRouteSettings: { ThrottlingBurstLimit: 40, ThrottlingRateLimit: 20 }

  WsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RelayFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*

  # ---------- custom domains (after the ACM certificate is validated) ----------
  PostDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomains
    Properties:
      DomainName: !Ref PostDomain
      DomainNameConfigurations:
        - { CertificateArn: !Ref CertificateArn, EndpointType: REGIONAL, SecurityPolicy: TLS_1_2 }

  PostMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomains
    DependsOn: HttpStage
    Properties: { DomainName: !Ref PostDomainName, ApiId: !Ref HttpApi, Stage: $default }

  WsDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomains
    Properties:
      DomainName: !Ref WsDomain
      DomainNameConfigurations:
        - { CertificateArn: !Ref CertificateArn, EndpointType: REGIONAL, SecurityPolicy: TLS_1_2 }

  WsMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomains
    DependsOn: WsStage
    Properties: { DomainName: !Ref WsDomainName, ApiId: !Ref WsApi, Stage: v1 }

  # ---------- synthetic probe ----------
  ProbeLogs:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 14 }

  ProbeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ProbeLogs.Arn

  ProbeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: hn-relay/1 synthetic probe (POST -> WebSocket round trip)
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: probe.handler
      Code: src/
      Role: !GetAtt ProbeRole.Arn
      Timeout: 25
      MemorySize: 256
      LoggingConfig: { LogGroup: !Ref ProbeLogs }
      Environment:
        Variables:
          PROBE_SECRET: !Ref ProbeSecret
          PROBE_SEED: !Sub '${AWS::AccountId}/${AWS::StackName}'
          PROBE_POST_URL: !If [HasDomains, !Sub 'https://${PostDomain}', !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com']
          PROBE_WS_URL: !If [HasDomains, !Sub 'wss://${WsDomain}/v1', !Sub 'wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/v1']

  ProbeNoRetry:
    Type: AWS::Lambda::EventInvokeConfig
    Properties: { FunctionName: !Ref ProbeFunction, Qualifier: $LATEST, MaximumRetryAttempts: 0 }

  ProbeSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId } }
      Policies:
        - PolicyName: invoke-probe
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: lambda:InvokeFunction, Resource: !GetAtt ProbeFunction.Arn }

  ProbeSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: hn-relay/1 probe every 15 minutes
      ScheduleExpression: rate(15 minutes)
      FlexibleTimeWindow: { Mode: 'OFF' }
      Target:
        Arn: !GetAtt ProbeFunction.Arn
        RoleArn: !GetAtt ProbeSchedulerRole.Arn
        RetryPolicy: { MaximumRetryAttempts: 0 }

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasEmail
    Properties:
      Subscription: [{ Protocol: email, Endpoint: !Ref AlertEmail }]

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: HasEmail
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition: { StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId } }

  # 30-min window holds two probe runs: any error, or no run at all, raises the alarm.
  ProbeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HumanNeeded relay probe failed (cloud POST -> PC WebSocket round trip)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ProbeFunction }]
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: !If [HasEmail, [!Ref AlertTopic], []]
      OKActions: !If [HasEmail, [!Ref AlertTopic], []]

  # Early warning (D-066): 70 % of the 20/s POST ceiling as a 1-hour average = 14/s, about 2,100 active users
  # at relay-api §3.4 rates (per user: 0.0067 POST/s; 0.011 WebSocket messages/s in+out). Time to revisit.
  # Budget data lags up to a day; these come first.
  PostTrafficAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HumanNeeded relay EARLY WARNING - POST traffic at 70% of the 20/s ceiling (~2,100 users, or abuse). See relay/RUNBOOK.md
      Namespace: AWS/ApiGateway
      MetricName: Count
      Dimensions: [{ Name: ApiId, Value: !Ref HttpApi }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 50400
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasEmail, [!Ref AlertTopic], []]

  WsTrafficAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HumanNeeded relay EARLY WARNING - WebSocket messages at the ~2,100-user level (or abuse). See relay/RUNBOOK.md
      Namespace: AWS/ApiGateway
      MetricName: MessageCount
      Dimensions: [{ Name: ApiId, Value: !Ref WsApi }, { Name: Stage, Value: v1 }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 83000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasEmail, [!Ref AlertTopic], []]

  # ---------- auto-brake: traffic far above normal -> throttle both APIs to 3/s ----------
  BrakeTopic:
    Type: AWS::SNS::Topic
    # Not encrypted with alias/aws/sns: CloudWatch alarms can't publish to topics using that key.
    Properties: {}

  BrakeTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref BrakeTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref BrakeTopic
            Condition: { StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId } }

  BrakeLogs:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 14 }

  BrakeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: brake
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BrakeLogs.Arn
              - Effect: Allow
                Action: apigateway:PATCH
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${HttpApi}/stages/*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${WsApi}/stages/*

  BrakeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: hn-relay/1 auto-brake (throttle both APIs on a traffic flood)
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: brake.handler
      Code: src/
      Role: !GetAtt BrakeRole.Arn
      Timeout: 15
      MemorySize: 256
      LoggingConfig: { LogGroup: !Ref BrakeLogs }
      Environment:
        Variables: { HTTP_API: !Ref HttpApi, WS_API: !Ref WsApi, BRAKE_RATE: '3', BRAKE_BURST: '6' }

  BrakePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BrakeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref BrakeTopic

  BrakeSubscription:
    Type: AWS::SNS::Subscription
    Properties: { TopicArn: !Ref BrakeTopic, Protocol: lambda, Endpoint: !GetAtt BrakeFunction.Arn }

  # Brake: POST 5,400 in 5 min = 18/s (90 % of the ceiling, ~2,700 users); WebSocket 13,200 messages in 5 min
  # = 44/s in+out (~4,000 users). Above the early warning, so organic growth warns before it brakes.
  PostBrakeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HumanNeeded relay POST flood - AUTO-BRAKE engaged (both APIs throttled to 3/s). See relay/RUNBOOK.md
      Namespace: AWS/ApiGateway
      MetricName: Count
      Dimensions: [{ Name: ApiId, Value: !Ref HttpApi }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5400
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasEmail, [!Ref BrakeTopic, !Ref AlertTopic], [!Ref BrakeTopic]]

  WsBrakeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HumanNeeded relay WebSocket flood - AUTO-BRAKE engaged (both APIs throttled to 3/s). See relay/RUNBOOK.md
      Namespace: AWS/ApiGateway
      MetricName: MessageCount
      Dimensions: [{ Name: ApiId, Value: !Ref WsApi }, { Name: Stage, Value: v1 }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 13200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasEmail, [!Ref BrakeTopic, !Ref AlertTopic], [!Ref BrakeTopic]]

  RelayErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HumanNeeded relay function errors or throttles (concurrency exhausted)
      Metrics:
        - Id: e
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref RelayFunction }] }
            Period: 900
            Stat: Sum
        - Id: t
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{ Name: FunctionName, Value: !Ref RelayFunction }] }
            Period: 900
            Stat: Sum
        - { Id: total, Expression: 'FILL(e,0)+FILL(t,0)', Label: errors+throttles, ReturnData: true }
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasEmail, [!Ref AlertTopic], []]

  # AWS Budgets is account-wide: alerts at $5 and $20 actual monthly spend.
  Budget:
    Type: AWS::Budgets::Budget
    Condition: HasEmail
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 20, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 25, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  PostUrl:
    Description: Cloud hooks POST to <PostUrl>/v1/h/<K>
    Value: !If [HasDomains, !Sub 'https://${PostDomain}', !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com']
  WebSocketUrl:
    Value: !If [HasDomains, !Sub 'wss://${WsDomain}/v1', !Sub 'wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/v1']
  PostDomainTarget:
    Condition: HasDomains
    Description: Cloudflare DNS-only CNAME target for PostDomain
    Value: !GetAtt PostDomainName.RegionalDomainName
  WsDomainTarget:
    Condition: HasDomains
    Description: Cloudflare DNS-only CNAME target for WsDomain
    Value: !GetAtt WsDomainName.RegionalDomainName
  RawPostUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  RawWebSocketUrl:
    Value: !Sub 'wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/v1'
